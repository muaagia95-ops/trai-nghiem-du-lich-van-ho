<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f2b"><title>Vân Hồ – Bài viết</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#123f2b;--gold:#d8a02a;--cream:#f5f1e8;--text:#20372c;--muted:#68756d;--line:#e5e9e5}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:"Be Vietnam Pro",Arial,sans-serif;line-height:1.75;background:#fff}a{text-decoration:none;color:inherit}.container{width:min(900px,calc(100% - 28px));margin:auto}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}.nav{height:64px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:800;color:var(--green)}.back{font-size:13px;font-weight:700;color:var(--green)}main{padding:54px 0 80px}.meta{font-size:12px;color:var(--gold);font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.title{font-size:clamp(34px,6vw,58px);line-height:1.08;margin:10px 0 12px;color:var(--green)}.excerpt{font-size:18px;color:var(--muted);margin:0 0 28px}.cover{width:100%;max-height:560px;object-fit:cover;border-radius:18px;margin:0 0 36px}.content{font-size:17px}.content p{margin:0 0 18px}.content h2{color:var(--green);font-size:27px;margin:34px 0 12px}.content img{max-width:100%;border-radius:14px;margin:22px 0}.empty{text-align:center;padding:80px 0}.share{margin-top:38px;padding-top:22px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
</style></head><body><header><div class="container nav"><a class="logo" href="index.html">VÂN HỒ</a><a class="back" href="index.html">← Về trang chủ</a></div></header><main><article class="container" id="article"><div class="empty">Đang tải bài viết…</div></article></main><script>
const q=new URLSearchParams(location.search),slug=q.get('slug');
async function load(){const el=document.getElementById('article');if(!slug){el.innerHTML='<div class="empty">Không tìm thấy bài viết.</div>';return}try{const r=await fetch('content/posts.json?v='+Date.now());const posts=await r.json();const p=posts.find(x=>x.slug===slug);if(!p){el.innerHTML='<div class="empty">Bài viết không tồn tại hoặc đã bị xóa.</div>';return}document.title=p.title+' – Vân Hồ';el.innerHTML=`<div class="meta">${escapeHtml(p.category||'Vân Hồ')} · ${escapeHtml(p.date||'')}</div><h1 class="title">${escapeHtml(p.title)}</h1>${p.excerpt?`<p class="excerpt">${escapeHtml(p.excerpt)}</p>`:''}${p.image?`<img class="cover" src="${safeUrl(p.image)}" alt="${escapeHtml(p.title)}">`:''}<div class="content">${p.contentHtml||textToHtml(p.content||'')}</div><div class="share">VÂN HỒ – CHẠM VÀO NÚI RỪNG</div>`}catch(e){el.innerHTML='<div class="empty">Không thể tải dữ liệu bài viết.</div>'}}
function escapeHtml(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function safeUrl(s=''){return s.replace(/"/g,'%22')}function textToHtml(s){return escapeHtml(s).split(/\n\s*\n/).map(x=>'<p>'+x.replace(/\n/g,'<br>')+'</p>').join('')}load();
</script></body></html>
